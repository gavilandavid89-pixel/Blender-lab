name: Blender Headless Lab

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/blender.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Build world, test motion and render preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out lab
        uses: actions/checkout@v4

      - name: Validate scene profile contracts
        run: python3 scripts/validate_scene_profiles.py

      - name: Self-test world manifest validator
        run: python3 scripts/validate_world_manifest.py --self-test

      - name: Run ST-LAT contract regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Self-test motion report validator
        run: python3 scripts/validate_motion_report.py --self-test

      - name: Self-test deterministic manifest validator
        run: python3 scripts/validate_deterministic_manifest.py --self-test

      - name: Install Linux graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils libegl1 libgl1 libxkbcommon0 libxi6 libxrender1 libxfixes3 libx11-6 libxext6 libsm6 libice6 libxxf86vm1 libgomp1

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Build world and run deterministic validation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          "$BLENDER_BIN" --background --factory-startup --python scripts/world3d_probe.py 2>&1 | tee blender.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "First world build failed with exit code $status" | tee -a blender.log
            echo "Retrying world build once with clean Blender user config..." | tee -a blender.log
            rm -rf /tmp/blender-user-config
            BLENDER_USER_CONFIG=/tmp/blender-user-config \
              "$BLENDER_BIN" --background --factory-startup --python scripts/world3d_probe.py 2>&1 | tee -a blender.log
            status=${PIPESTATUS[0]}
          fi
          echo "$status" > artifacts/exit-code.txt
          if [ "$status" -ne 0 ]; then
            echo "World build failed after retry. Last log lines:" | tee -a blender.log
            tail -n 100 blender.log
            exit "$status"
          fi

          "$BLENDER_BIN" --background artifacts/stlat-world3d.blend --python scripts/world3d_validate_motion.py 2>&1 | tee -a blender.log
          validation_status=${PIPESTATUS[0]}
          echo "$validation_status" > artifacts/motion-validation-exit-code.txt
          if [ "$validation_status" -ne 0 ]; then
            echo "Motion/collision validation failed. Last log lines:" | tee -a blender.log
            tail -n 100 blender.log
            exit "$validation_status"
          fi

      - name: Rebuild world without rendering and compare stable IDs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          cp artifacts/stlat-world3d-manifest.json artifacts/stlat-world3d-manifest-first-build.json
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          STLAT_SKIP_RENDER=1 "$BLENDER_BIN" --background --factory-startup --python scripts/world3d_probe.py 2>&1 | tee -a blender.log
          python3 scripts/validate_deterministic_manifest.py artifacts/stlat-world3d-manifest-first-build.json artifacts/stlat-world3d-manifest.json artifacts/stlat-world3d-determinism.json

      - name: Test camera isolation in the saved Blender scene
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          "$BLENDER_BIN" --background artifacts/stlat-world3d.blend --python scripts/world3d_validate_camera_isolation.py 2>&1 | tee -a blender.log

      - name: Validate persisted camera-isolation report
        if: success()
        run: python3 scripts/validate_camera_isolation_report.py

      - name: Self-test camera-isolation report validator
        run: python3 scripts/validate_camera_isolation_report.py --self-test

      - name: Validate persisted motion report
        if: success()
        run: python3 scripts/validate_motion_report.py

      - name: Validate semantic world manifest
        if: success()
        run: python3 scripts/validate_world_manifest.py

      - name: Validate output files
        if: success()
        shell: bash
        run: |
          test -s artifacts/stlat-world3d.blend
          test -s artifacts/stlat-world3d-main.png
          test -s artifacts/stlat-world3d-topdown.png
          test -s artifacts/stlat-world3d-manifest.json
          test -s artifacts/stlat-world3d-motion-validation.json
          test -s artifacts/stlat-world3d-camera-isolation.json
          test -s artifacts/stlat-world3d-determinism.json
          file artifacts/stlat-world3d-main.png artifacts/stlat-world3d-topdown.png
          cat artifacts/stlat-world3d-manifest.json
          cat artifacts/stlat-world3d-motion-validation.json
          cat artifacts/stlat-world3d-camera-isolation.json
          cat artifacts/stlat-world3d-determinism.json

      - name: Publish scene, renders and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stlat-world3d-output
          path: |
            artifacts/
            blender.log
          if-no-files-found: warn
          retention-days: 14
