name: Blender Headless Lab

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/blender.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Build world, test motion and render preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out lab
        uses: actions/checkout@v4

      - name: Validate scene profile contracts
        run: python3 scripts/validate_scene_profiles.py

      - name: Self-test world manifest validator
        run: python3 scripts/validate_world_manifest.py --self-test

      - name: Run ST-LAT contract regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Live AI planner contract test (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "STLAT_AI_PLANNER=SKIP: configure repository Actions secret GROQ_API_KEY to enable the live provider test."
            exit 0
          fi
          mkdir -p artifacts
          python3 scripts/ai_world_planner.py \
            --snapshot tests/fixtures/ai_planner_snapshot.json \
            --prompt "Propose exactly one transform update for existing entity char.001: set its position to [0.3, 0.0, 1.0] meters. Keep rotation and scale unchanged. Do not modify prop.ball.001 or any identity." \
            --output artifacts/ai-world-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/ai-world-plan.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("tests/fixtures/ai_planner_snapshot.json").read_text(encoding="utf-8"))
          plan = result.get("plan", {})
          ops = plan.get("operations", [])
          if result.get("status") != "proposed":
              raise SystemExit("AI planner contract failed: status is not proposed")
          if len(ops) != 1:
              raise SystemExit(f"AI planner contract failed: expected exactly 1 operation, got {len(ops)}")
          op = ops[0]
          if op.get("type") != "transform_updated" or op.get("target_id") != "char.001":
              raise SystemExit("AI planner contract failed: operation type/target mismatch")
          transform = op.get("transform", {})
          target = next(e for e in snapshot["entities"] if e["id"] == "char.001")
          if transform.get("position") != [0.3, 0.0, 1.0]:
              raise SystemExit(f"AI planner contract failed: wrong position {transform.get('position')!r}")
          if transform.get("rotation_euler_rad") != target["transform"]["rotation_euler_rad"]:
              raise SystemExit("AI planner contract failed: rotation changed without authorization")
          if transform.get("scale") != target["transform"]["scale"]:
              raise SystemExit("AI planner contract failed: scale changed without authorization")
          if any(item.get("target_id") == "prop.ball.001" for item in ops):
              raise SystemExit("AI planner contract failed: protected ball was modified")
          if any(key in op for key in ("identity_ref", "identity_signature", "asset_id", "appearance_id", "role", "parent_id")):
              raise SystemExit("AI planner contract failed: protected identity/relationship fields appeared")
          print("STLAT_AI_PLANNER_CONTRACT_TEST=PASS (exact target, exact position, unchanged rotation/scale, no collateral edits)")
          PY

      - name: Self-test motion report validator
        run: python3 scripts/validate_motion_report.py --self-test

      - name: Self-test world event replay
        run: python3 scripts/validate_world_replay.py

      - name: Self-test persistent world snapshot store
        run: python3 scripts/validate_world_store.py

      - name: Self-test character reference manifest validator
        run: python3 scripts/validate_character_reference_manifest.py

      - name: Self-test deterministic manifest validator
        run: python3 scripts/validate_deterministic_manifest.py --self-test

      - name: Install Linux graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils ffmpeg libegl1 libgl1 libxkbcommon0 libxi6 libxrender1 libxfixes3 libx11-6 libxext6 libsm6 libice6 libxxf86vm1 libgomp1

      - name: Install Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
          /tmp/blender-5.2.2-linux-x64/blender --version

      - name: Build world and run deterministic validation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          "$BLENDER_BIN" --background --factory-startup --python scripts/world3d_probe.py 2>&1 | tee blender.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "First world build failed with exit code $status" | tee -a blender.log
            echo "Retrying world build once with clean Blender user config..." | tee -a blender.log
            rm -rf /tmp/blender-user-config
            BLENDER_USER_CONFIG=/tmp/blender-user-config \
              "$BLENDER_BIN" --background --factory-startup --python scripts/world3d_probe.py 2>&1 | tee -a blender.log
            status=${PIPESTATUS[0]}
          fi
          echo "$status" > artifacts/exit-code.txt
          if [ "$status" -ne 0 ]; then
            echo "World build failed after retry. Last log lines:" | tee -a blender.log
            tail -n 100 blender.log
            exit "$status"
          fi

          "$BLENDER_BIN" --background artifacts/stlat-world3d.blend --python scripts/world3d_validate_motion.py 2>&1 | tee -a blender.log
          validation_status=${PIPESTATUS[0]}
          echo "$validation_status" > artifacts/motion-validation-exit-code.txt
          if [ "$validation_status" -ne 0 ]; then
            echo "Motion/collision validation failed. Last log lines:" | tee -a blender.log
            tail -n 100 blender.log
            exit "$validation_status"
          fi

      - name: Render and verify a real MP4 smoke test
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          "$BLENDER_BIN" --background artifacts/stlat-world3d.blend --python scripts/stlat_video_smoke.py 2>&1 | tee -a blender.log
          test -s artifacts/stlat-video-smoke.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json artifacts/stlat-video-smoke.mp4 > artifacts/stlat-video-smoke-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/stlat-video-smoke.json").read_text())
          probe = json.loads(Path("artifacts/stlat-video-smoke-probe.json").read_text())
          streams = probe.get("streams", [])
          if report.get("status") != "rendered" or report.get("ai_video_model_connected") is not False:
              raise SystemExit("VIDEO_SMOKE_VALIDATION=FAIL: incorrect or missing report")
          if len(streams) != 1:
              raise SystemExit(f"VIDEO_SMOKE_VALIDATION=FAIL: expected one video stream, got {len(streams)}")
          stream = streams[0]
          if stream.get("codec_name") != "h264" or (stream.get("width"), stream.get("height")) != (320, 180):
              raise SystemExit(f"VIDEO_SMOKE_VALIDATION=FAIL: unexpected video stream (expected effective 320x180 at 50% scale): {stream}")
          if int(stream.get("nb_frames", "0")) < 40:
              raise SystemExit(f"VIDEO_SMOKE_VALIDATION=FAIL: too few frames: {stream.get('nb_frames')}")
          duration = float(probe.get("format", {}).get("duration", 0))
          if duration < 1.5 or int(probe.get("format", {}).get("size", 0)) < 1024:
              raise SystemExit("VIDEO_SMOKE_VALIDATION=FAIL: duration or file size is implausible")
          print(f"VIDEO_SMOKE_VALIDATION=PASS (H.264, {stream['width']}x{stream['height']}, {stream['nb_frames']} frames, {duration:.2f}s)")
          PY

      - name: Rebuild world without rendering and compare stable IDs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          cp artifacts/stlat-world3d-manifest.json artifacts/stlat-world3d-manifest-first-build.json
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          STLAT_SKIP_RENDER=1 "$BLENDER_BIN" --background --factory-startup --python scripts/world3d_probe.py 2>&1 | tee -a blender.log
          python3 scripts/validate_deterministic_manifest.py artifacts/stlat-world3d-manifest-first-build.json artifacts/stlat-world3d-manifest.json artifacts/stlat-world3d-determinism.json

      - name: Test camera isolation in the saved Blender scene
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          "$BLENDER_BIN" --background artifacts/stlat-world3d.blend --python scripts/world3d_validate_camera_isolation.py 2>&1 | tee -a blender.log

      - name: Validate persisted camera-isolation report
        if: success()
        run: python3 scripts/validate_camera_isolation_report.py

      - name: Test persistent world-state synchronization with Blender
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          "$BLENDER_BIN" --background artifacts/stlat-world3d.blend --python scripts/world3d_sync_state.py -- --self-test 2>&1 | tee -a blender.log
          test -s artifacts/stlat-world-state-blender-sync.json
          cat artifacts/stlat-world-state-blender-sync.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/stlat-world-state-blender-sync.json").read_text(encoding="utf-8"))
          checks = report.get("checks")
          if report.get("status") != "passed" or not isinstance(checks, dict) or not checks or not all(value is True for value in checks.values()):
              raise SystemExit("WORLD_STATE_BLENDER_SYNC_REPORT_VALIDATION=FAIL: " + json.dumps(report, sort_keys=True))
          print(f"WORLD_STATE_BLENDER_SYNC_REPORT_VALIDATION=PASS ({len(checks)} checks)")
          PY

      - name: Self-test camera-isolation report validator
        run: python3 scripts/validate_camera_isolation_report.py --self-test

      - name: Validate persisted motion report
        if: success()
        run: python3 scripts/validate_motion_report.py

      - name: Validate semantic world manifest
        if: success()
        run: python3 scripts/validate_world_manifest.py

      - name: Validate output files
        if: success()
        shell: bash
        run: |
          test -s artifacts/stlat-world3d.blend
          test -s artifacts/stlat-world3d-main.png
          test -s artifacts/stlat-world3d-topdown.png
          test -s artifacts/stlat-world3d-manifest.json
          test -s artifacts/stlat-world3d-motion-validation.json
          test -s artifacts/stlat-world3d-camera-isolation.json
          test -s artifacts/stlat-world3d-determinism.json
          test -s artifacts/stlat-world-state-replay.json
          test -s artifacts/stlat-world-state-store.json
          test -s artifacts/stlat-world-state-blender-sync.json
          file artifacts/stlat-world3d-main.png artifacts/stlat-world3d-topdown.png
          cat artifacts/stlat-world3d-manifest.json
          cat artifacts/stlat-world3d-motion-validation.json
          cat artifacts/stlat-world3d-camera-isolation.json
          cat artifacts/stlat-world3d-determinism.json
          cat artifacts/stlat-world-state-replay.json
          cat artifacts/stlat-world-state-store.json
          cat artifacts/stlat-world-state-blender-sync.json

      - name: Publish scene, renders and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stlat-world3d-output
          path: |
            artifacts/
            blender.log
          if-no-files-found: warn
          retention-days: 14
